name: Release All

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test Core & CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install CMake
        run: sudo apt-get install -y cmake
      - name: Run Tests
        # Exclude desktop tests as they require display environment (or xvfb)
        run: cargo test --workspace --exclude oss-desktop

  build-cli-linux:
    name: CLI Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Cargo Deb
        run: cargo install cargo-deb
      - name: Build Release
        run: cargo build --release -p oss-cli
      - name: Build Deb
        run: |
          mkdir -p dist-cli
          # Strip 'v' from tag name for versioning if needed, but cargo-deb reads Cargo.toml usually.
          # We force the output filename.
          cargo deb -p oss-cli --no-build --output dist-cli/oss-manager-cli_${{ github.ref_name }}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: dist-cli/*

  build-cli-windows:
    name: CLI Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release -p oss-cli
      - name: Install Inno Setup
        run: choco install innosetup
      - name: Build Installer
        shell: cmd
        # Override MyAppVersion with tag name
        run: |
          mkdir dist-cli
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "oss-cli\setup.iss" "/Odist-cli" "/Foss-manager-cli_${{ github.ref_name }}_x64_setup" "/DMyAppVersion=${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: dist-cli/*

  build-desktop:
    name: Desktop ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Deps
        working-directory: ./oss-desktop
        run: npm install

      - name: Build Desktop
        working-directory: ./oss-desktop
        run: npm run tauri build

      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir -p dist-desktop
          # Find and copy artifacts from target/release/bundle/
          # Note: On Windows, paths might use backslashes, but bash handles forward slashes ok.
          # We look for .deb, .AppImage on Linux; .msi, .exe on Windows (NSIS).
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} dist-desktop/ \;
          ls -l dist-desktop/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-desktop/*

  release:
    name: Publish Release
    needs: [build-cli-linux, build-cli-windows, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Display Artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/cli-linux/*
            artifacts/cli-windows/*
            artifacts/desktop-ubuntu-22.04/*
            artifacts/desktop-windows-latest/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
