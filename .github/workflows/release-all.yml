name: Release All

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test Core & CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install CMake
        run: sudo apt-get install -y cmake
      - name: Run Tests
        run: cargo test --workspace --exclude oss-desktop

  build-linux-cli:
    name: Linux CLI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Cargo Deb
        run: cargo install cargo-deb
      - name: Build Release
        run: cargo build --release -p oss-cli
      - name: Build Deb
        run: |
          mkdir -p dist-cli
          cargo deb -p oss-cli --no-build --output dist-cli/oss-manager-cli_${{ inputs.tag_name }}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: dist-cli/*

  build-linux-desktop:
    name: Linux Desktop
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Desktop
        working-directory: ./oss-desktop
        run: |
          npm install
          npm run tauri build
      - name: Collect Artifacts
        run: |
          mkdir -p dist-desktop
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-desktop/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist-desktop/*

  build-windows:
    name: Windows All
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Build CLI
        run: cargo build --release -p oss-cli
      
      - name: Build Desktop
        working-directory: ./oss-desktop
        run: |
          npm install
          npm run tauri build

      - name: Create Dist Dir
        run: mkdir dist-win
        shell: cmd

      - name: Package CLI (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "oss-cli\setup.iss" "/Odist-win" "/Foss-manager-cli_${{ inputs.tag_name }}_x64_setup" "/DMyAppVersion=${{ inputs.tag_name }}"

      - name: Package Desktop+CLI (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "oss-desktop\setup.iss" "/Odist-win" "/Foss-manager-desktop_${{ inputs.tag_name }}_x64_setup" "/DMyAppVersion=${{ inputs.tag_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist-win/*

  release:
    name: Publish Release
    needs: [build-linux-cli, build-linux-desktop, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Display Artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/linux-cli/*
            artifacts/linux-desktop/*
            artifacts/windows-installers/*
          token: ${{ secrets.GITHUB_TOKEN }}
