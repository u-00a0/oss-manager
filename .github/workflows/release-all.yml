name: Build and Release (All Platforms)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号 (例如: v0.1.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  WEBVIEW2_URL: ${{ secrets.WEBVIEW2_URL }}

permissions:
  contents: write
  packages: write

jobs:
  tag-management:
    name: 标签管理
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 更新 Git 标签
        run: |
          TAG_NAME=${{ inputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "标签 $TAG_NAME 已存在。正在删除并重新创建..."
            git tag -d "$TAG_NAME"
            git push origin ":refs/tags/$TAG_NAME"
          fi
          
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

  build-windows:
    name: 构建 Windows (AMD64)
    needs: tag-management
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: 安装依赖
        run: |
          cd oss-desktop
          npm install --legacy-peer-deps
          
      - name: 前端构建
        run: |
          cd oss-desktop
          npm run build
          
      - name: 编译 Rust 二进制文件
        run: |
          # 1. 首先只构建 oss-cli，确保 oss-cli.exe 文件存在
          cargo build --release --package oss-cli
          
          # 2. 现在构建整个工作区。oss-desktop 的 build.rs 脚本将能找到它需要的资源
          cargo build --release
          
          # 3. 验证所有二进制文件是否都已成功生成
          if (-not (Test-Path "target/release/oss-manager.exe")) { throw "oss-manager.exe 编译失败" }
          if (-not (Test-Path "target/release/oss-cli.exe")) { throw "oss-cli.exe 编译失败" }

      - name: 准备 WebView2 离线包 (CAB 格式)
        if: env.WEBVIEW2_URL != ''
        run: |
          echo "正在从 $env:WEBVIEW2_URL 下载 WebView2 离线包..."
          Invoke-WebRequest -Uri "$env:WEBVIEW2_URL" -OutFile "webview2.cab"
          New-Item -ItemType Directory -Force -Path "webview2-fixed"
          # 解压 CAB
          expand webview2.cab -F:* "webview2-fixed"
          Get-ChildItem "webview2-fixed"

      - name: 构建标准版 (NSIS, 系统 WebView)
        run: |
          cd oss-desktop
          npm run tauri build -- --target nsis
          
          # 移动产物以防被覆盖
          New-Item -ItemType Directory -Force -Path "../artifacts"
          $setup = Get-ChildItem "../target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($setup) {
            Move-Item $setup.FullName "../artifacts/oss-manager-setup-windows-amd64.exe"
          } else {
            throw "Standard NSIS installer not found"
          }

      - name: 构建完整版 (NSIS, 内置 WebView)
        if: env.WEBVIEW2_URL != ''
        run: |
          cd oss-desktop
          # 创建临时配置覆盖文件
          $config = @{
            bundle = @{
              windows = @{
                webviewInstallMode = "fixedRuntime"
                webviewFixedRuntimePath = "../../webview2-fixed"
              }
            }
          }
          $configJson = $config | ConvertTo-Json -Depth 5
          $configJson | Set-Content "nsis-fixed-config.json"
          
          # 运行构建，应用配置覆盖
          npm run tauri build -- --target nsis --config nsis-fixed-config.json
          
          # 移动产物
          $setup = Get-ChildItem "../target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($setup) {
            Move-Item $setup.FullName "../artifacts/oss-manager-full-setup-windows-amd64.exe"
          } else {
            throw "Fixed NSIS installer not found"
          }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/*

  build-linux:
    name: 构建 Linux (AMD64)
    needs: tag-management
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          # 注意：Tauri v2 在 Linux 上现在默认使用 WebKitGTK 4.1
          # 因此我们需要安装 libwebkit2gtk-4.1-dev 和 libsoup-3.0-dev
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev
          
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: 安装 cargo-deb
        run: cargo install cargo-deb

      - name: 构建 oss-cli (Deb)
        run: |
          cargo deb -p oss-cli
          mkdir -p artifacts
          cp target/debian/oss-cli_*.deb artifacts/oss-cli_amd64.deb

      - name: 构建 oss-desktop (Deb & AppImage)
        run: |
          cd oss-desktop
          npm install --legacy-peer-deps
          npm run build
          # 确保 release 目录有 oss-cli (虽然 cargo deb 可能已经构建了，但再次确认)
          cd .. && cargo build --release -p oss-cli 
          
          # 关键步骤：复制 oss-cli 为 oss-cli.exe 以满足 tauri.conf.json 在 Linux 上的资源检查
          cp target/release/oss-cli target/release/oss-cli.exe
          
          cd oss-desktop
          npm run tauri build
          
      - name: 收集 Linux 产物
        run: |
          mkdir -p artifacts
          # 收集 AppImage
          find target/release/bundle/appimage -name "*.AppImage" -exec cp {} artifacts/oss-manager-desktop_amd64.AppImage \;
          # 收集 Deb (桌面版)
          find target/release/bundle/deb -name "*.deb" -exec cp {} artifacts/oss-manager-desktop_amd64.deb \;
          ls -lh artifacts/

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/*

  release:
    name: 创建 GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          
      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          draft: false
          prerelease: false
          files: dist/*
          body: |
            ## OSS Manager ${{ inputs.tag }}
            
            **包含的软件包 / Included Packages:**
            - **Windows (x64)** - NSIS Installer:
              - `oss-manager-setup-windows-amd64.exe`: **标准安装程序** (Standard) - 使用系统 WebView2，体积较小。
              - `oss-manager-full-setup-windows-amd64.exe`: **完整安装程序** (Full/Offline) - 内置 WebView2 运行时。
            - **Linux (x64)**:
              - `oss-manager-desktop_amd64.deb`: 桌面端 DEB 安装包。
              - `oss-manager-desktop_amd64.AppImage`: 桌面端 AppImage。
              - `oss-cli_amd64.deb`: 命令行工具 (CLI) DEB 安装包。
            
            **注意**: Windows 安装程序默认安装到 Program Files。