name: Release All

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test Core & CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install CMake
        run: sudo apt-get install -y cmake
      - name: Run Tests
        run: cargo test --workspace --exclude oss-desktop

  build-linux-cli:
    name: Linux CLI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Cargo Deb
        run: cargo install cargo-deb
      - name: Build Release
        run: cargo build --release -p oss-cli
      - name: Build Deb
        run: |
          mkdir -p dist-cli
          cargo deb -p oss-cli --no-build --output dist-cli/oss-manager-cli_${{ inputs.tag_name }}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: dist-cli/*

  build-linux-desktop:
    name: Linux Desktop
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: oss-desktop/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Desktop
        working-directory: ./oss-desktop
        run: |
          npm install --legacy-peer-deps
          npm run tauri build
      - name: Collect Artifacts
        run: |
          mkdir -p dist-desktop
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-desktop/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist-desktop/*

  build-windows:
    name: Windows All
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: oss-desktop/package-lock.json
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Build CLI
        run: cargo build --release -p oss-cli
      
      - name: Build Desktop
        working-directory: ./oss-desktop
        run: |
          npm install --legacy-peer-deps
          npm run tauri build

      - name: Check WebView2Loader.dll
        shell: powershell
        run: |
          if (Test-Path "oss-desktop/target/release/WebView2Loader.dll") {
            Write-Host "WebView2Loader.dll found."
          } else {
            Write-Warning "WebView2Loader.dll NOT found in oss-desktop/target/release."
            Get-ChildItem -Path "oss-desktop/target/release"
          }

      - name: Create Dist Dir
        run: mkdir dist-win
        shell: cmd

      - name: Prepare Fixed WebView2 Runtime
        id: prepare-fixed
        shell: powershell
        env:
          WEBVIEW2_URL: ${{ secrets.WEBVIEW2_URL }}
        run: |
          if ([string]::IsNullOrEmpty($env:WEBVIEW2_URL)) {
            Write-Warning "WEBVIEW2_URL secret not set. Skipping Fixed Version build."
            echo "skipped=true" >> $env:GITHUB_OUTPUT
            return
          }
          
          $CabPath = "webview2.cab"
          Invoke-WebRequest -Uri $env:WEBVIEW2_URL -OutFile $CabPath
          
          mkdir webview2-temp
          expand $CabPath -F:* webview2-temp
          
          # The cab usually contains a versioned folder
          $VersionDir = Get-ChildItem -Path webview2-temp -Directory | Select-Object -First 1
          if ($VersionDir) {
             # Move contents to a folder named 'webview2-fixed' in project root
             mkdir webview2-fixed
             Copy-Item -Path "$($VersionDir.FullName)\*" -Destination webview2-fixed -Recurse
             echo "skipped=false" >> $env:GITHUB_OUTPUT
          } else {
             Write-Error "Could not find versioned directory in cab."
             echo "skipped=true" >> $env:GITHUB_OUTPUT
          }
          Remove-Item $CabPath -Force
          Remove-Item -Recurse -Force webview2-temp

      - name: Package CLI (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "oss-cli\setup.iss" "/Odist-win" "/Foss-manager-cli_${{ inputs.tag_name }}_x64_setup" "/DMyAppVersion=${{ inputs.tag_name }}"

      - name: Package Desktop+CLI (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "oss-desktop\setup.iss" "/Odist-win" "/Foss-manager-desktop_${{ inputs.tag_name }}_x64_setup" "/DMyAppVersion=${{ inputs.tag_name }}"

      - name: Package Desktop+CLI (Fixed Version)
        if: steps.prepare-fixed.outputs.skipped != 'true'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "oss-desktop\setup-fixed.iss" "/Odist-win" "/Foss-manager-desktop-full_${{ inputs.tag_name }}_x64_setup" "/DMyAppVersion=${{ inputs.tag_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist-win/*

  release:
    name: Publish Release
    needs: [build-linux-cli, build-linux-desktop, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Display Artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/linux-cli/*
            artifacts/linux-desktop/*
            artifacts/windows-installers/*
          token: ${{ secrets.GITHUB_TOKEN }}
