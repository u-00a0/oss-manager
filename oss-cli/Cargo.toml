[package]
name = "oss-cli"
version = "0.1.1"
authors = ["u202f"]
edition = "2021"

[dependencies]
oss-core = { path = "../oss-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
dotenvy = "0.15"
inquire = "0.9.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
indicatif = "0.18.3"

[package.metadata.deb]
maintainer = "u202f"
copyright = "© 2026 OSS Manager Contributors. Some rights reserved."
depends = "$auto"
section = "utility"
priority = "optional"
extended-description = """
A powerful file management tool for S3 compatible Object Storage Services.
Supports high-performance object storage file transfer, resumable uploads,
recursive operations, and multi-cloud management.
"""
assets = [
    ["target/release/oss-cli", "usr/bin/oss-cli", "755"]
]

[build-dependencies]
winres = "0.1"
