[package]
name = "oss-core"
version = "0.1.1"
edition = "2021"

[dependencies]
# AWS SDK with rustls for cross-platform support
aws-config = { version = "1.5", default-features = false, features = ["rustls", "behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1.60", default-features = false, features = ["rustls", "rt-tokio"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono"] }

# Error handling
anyhow = "1"
thiserror = "2"
aws-credential-types = "1.2.11"
aws-types = "1.3.11"
chrono = { version = "0.4.42", features = ["serde"] }
walkdir = "2.5.0"
futures = "0.3.31"
uuid = { version = "1.19.0", features = ["v4"] }
tracing = "0.1.44"
tokio-util = { version = "0.7.17", features = ["default"] }
